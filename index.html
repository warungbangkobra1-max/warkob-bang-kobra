<!doctype html>
<html lang="id">
  <head>
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var customFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(newFetch) {
              customFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var fallbackFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              value: fallbackFetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
          } catch (err) {}
        }
      })();
    </script>
